<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KashView</title>
<style>
:root{--b:#1d4ed8;--bd:#1e3a8a;--bl:#e3ebfb;--o:#f59e0b;--o2:#ea580c;--bg:#eef3fc;--cd:#fff;--tx:#12203d;--mu:#5a6a8a;--br:#d6e0f3;--rd:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:#d9e2f4;color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px}
.top{background:linear-gradient(160deg,#2563eb,var(--bd));color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 70px;border-radius:0 0 34px 34px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.3rem Georgia,serif}
.right{display:flex;align-items:center;gap:8px}
.chip{border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff;border-radius:22px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:.9rem}
.lsel{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:22px;padding:8px 8px;font-weight:700}
.lsel option{color:#12203d}
.top h1{font-size:1.7rem;margin:18px 0 2px}.top p{margin:0;opacity:.92}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tot div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:12px}
.tot small{display:block;letter-spacing:.08em;font-weight:700;font-size:.72rem}.tot b{font-size:1.4rem}
.sec{display:none;padding:0 16px}.sec.on{display:block}
.bal{background:#fff;border-radius:28px;padding:20px;margin-top:-52px;box-shadow:0 10px 26px rgba(30,58,138,.25)}
.bal small{letter-spacing:.14em;font-weight:700;color:var(--b)}
.bal .n{font-size:2.8rem;font-weight:800;line-height:1.1;margin:6px 0 10px;color:var(--bd)}.bal .n span+span{font-size:1.2rem}
.pill{display:inline-block;border:1px solid var(--o);background:#fff4dd;color:#9a5a00;border-radius:20px;padding:6px 14px;font-weight:700;font-size:.9rem}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mini div{background:var(--bl);border-radius:18px;padding:12px;text-align:center}
.mini small{display:block;letter-spacing:.08em;font-weight:700;font-size:.72rem;color:var(--mu)}.mini b{font-size:1.6rem;color:var(--b)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:14px;border:0;border-radius:22px;padding:18px;text-align:left;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;cursor:pointer}
.cta b{font-size:1.25rem;display:block}.cta span{opacity:.95;font-size:.92rem}.cta i{font-style:normal;font-size:1.6rem;background:rgba(255,255,255,.28);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.two button{border:0;border-radius:20px;padding:16px 8px;font-weight:800;font-size:1rem;cursor:pointer;color:#fff}
.w{background:var(--b)}.p{background:var(--bd)}
.card{background:var(--cd);border:1px solid var(--br);border-radius:22px;padding:16px;margin-top:14px}
.card h2{margin:0 0 6px;font-size:1.1rem}
.ban{background:#fff4dd;border:1px solid var(--o);border-radius:16px;padding:12px;margin-top:14px;font-size:.92rem}
.ban button{margin-top:8px}
.btn{background:var(--b);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer}
.btn.or{background:var(--o2)}.btn.wa{background:#1fa855}.btn.o{background:#fff;color:var(--b);border:2px solid var(--b)}.btn.full{width:100%;display:block;text-align:center;text-decoration:none}
.chips{display:flex;gap:8px;overflow-x:auto;background:#fff;border-radius:20px;padding:8px;margin-top:14px}
.chips button{border:0;background:none;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--mu);white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--b);color:#fff}
.it{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;border-left:6px solid var(--o);padding:12px;margin-top:12px}
.it .ic{width:46px;height:46px;border-radius:12px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.it div.t{flex:1;min-width:0}.it small{color:var(--mu)}
.it .m{text-align:right;font-weight:800}.m.pos{color:var(--b)}.m.neg{color:var(--rd)}
.bd{display:inline-block;font-size:.72rem;font-weight:800;border-radius:12px;padding:3px 10px;margin-top:4px;background:#dbe7ff;color:var(--bd)}
.bd.y{background:#ffe9c2;color:#8a4f00}.bd.r{background:#fee2e2;color:#991b1b}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed #f6c36b;border-radius:18px;padding:14px;background:#fffaf0;margin:10px 0}
.code b{font-size:1.5rem;letter-spacing:.12em;color:var(--o2)}
.hd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 0}.hd h3{margin:0;font-size:1.2rem}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bd);border-radius:28px 28px 0 0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{border:0;background:none;color:#c9d8fb;border-radius:18px;padding:8px 2px;font-weight:700;font-size:.74rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.4rem}nav button.on{background:#fff;color:var(--b)}
.au{position:fixed;inset:0;background:linear-gradient(160deg,#2563eb,var(--bd));z-index:20;overflow:auto;display:none;padding:20px 16px}
.au.on{display:block}.au .box{max-width:420px;margin:0 auto;background:#fff;border-radius:26px;padding:18px}
.au label{display:block;font-weight:700;font-size:.88rem;margin-top:10px}.au label small{font-weight:400;color:var(--mu)}
.au input,.au select.f{width:100%;padding:12px;margin-top:4px;border:1px solid var(--br);border-radius:12px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:10px;border:1px solid var(--br);border-radius:12px;background:var(--bg);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
#err{color:var(--rd);font-weight:700;min-height:1.3em;margin:10px 0 0;font-size:.9rem}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none;align-items:flex-end;justify-content:center}
.sh.on{display:flex}.sh .in{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.tk{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px;margin-top:10px}.tk div{flex:1}.tk small{color:var(--mu)}
.hid{display:none!important}
.lk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;margin-top:12px;text-decoration:none;color:inherit;border:0;width:100%;text-align:left;cursor:pointer;font:inherit}
.lk .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;flex:none}
.lk b{display:block}.lk small{color:var(--mu)}
</style>
</head>

function stat(s){s=String(s||"").toLowerCase();if(/^(r[eé]ussi|reyisi|success|ok)/.test(s))return"ok";if(/^(rej|refus)/.test(s))return"rej";return"pend"}

function hist(){var tin=0,tout=0,l=$("hl");l.innerHTML="";
 U.hist.forEach(function(h){if(stat(h.s)==="ok"){if(h.m>0)tin+=h.m;else tout+=-h.m}});
 $("ti").textContent="+"+n(tin)+" GDS";$("to").textContent="-"+n(tout)+" GDS";

 if(!A.length){l.innerHTML='<div class="card" style="color:var(--mu)">'+t("noHist")+'</div>';return}
 A.forEach(function(h){var k=kind(h.t),st=stat(h.s),d=document.createElement("div");d.className="it";
  d.innerHTML='<span class="ic">'+(ICO[k]||"💱")+'</span><div class="t"><b></b><small>📅 '+fd(h.d)+'</small></div><div class="m '+(h.m>=0?"pos":"neg")+'"><span></span><br><span class="bd'+(st==="ok"?"":st==="rej"?" r":" y")+'"></span></div>';

async function act(a){
 if(a==="help"){wa("Bonjour KashView, j'ai besoin d'aide."+who());return}
 if(a==="logout"){localStorage.removeItem("kv-s");U=null;DEMO=false;render();return}
 if(!U)return;
 if(a==="verify"){if(U.statut==="En attente de paiement"){alert(t("aAct"));return}wa("Bonjour KashView, je demande la vérification de mon compte. J'envoie ma pièce d'identité."+who());return}
 if(a==="pin"){var o=prompt(t("pOld")),p=prompt(t("pNew"));if(!o||!/^\d{4,8}$/.test(p||""))return;
  try{var j=await api({a:"pin",tel:U.tel,h:await hsh(U.tel,o),h2:await hsh(U.tel,p)});
   if(j.ok){localStorage.setItem("kv-s",JSON.stringify({tel:U.tel,h:await hsh(U.tel,p)}));alert(t("aPinOk"))}else alert(t("aPinBad"))}catch(x){alert(x.message)}return}
 if(a==="transfer"){
  if(U.statut!=="Vérifié"){alert(t("aTrOnly"));return}
  var to=prompt(t("pTo"));if(!to)return;
  var m=parseInt(prompt(t("pAmt")),10);if(!m||m<=0)return;
  if(m>U.solde){alert(t("aInsuf"));return}
  var f=Math.floor(m/100);
  if(confirm(t("cTr",{m:n(m),f:f,r:n(m-f)})))wa("Bonjour KashView, je demande un transfert de "+m+" GDS vers "+to+" (frais 1 % : "+f+" GDS)."+who());return}
 if(a==="withdraw"){
  if(U.statut==="En attente de paiement"){alert(t("aAct"));return}
  if(U.taches<20||U.gains<250){alert(t("aWd",{t:U.taches,g:n(U.gains)}));return}
  var me=prompt(t("pWdM"));if(!me)return;
  var w=prompt(t("pWdN"));if(!w)return;
  var q=parseInt(prompt(t("pWdA")),10);if(!q)return;
  if(q<200){alert(t("aMin"));return}
  if(q>U.solde){alert(t("aInsuf"));return}
  wa("Bonjour KashView, je demande un retrait de "+q+" GDS par "+me+" au "+w+"."+who())}
}

function setU(j,tel){U={nom:j.nom,prenom:j.prenom,tel:tel,statut:j.statut,code:j.code||"",solde:+j.solde||0,reserve:+j.reserve||0,gains:+j.gains||0,taches:+j.taches||0,refs:j.refs||[],hist:j.hist||[]};render()}
async function login(tel,pin){var h=await hsh(tel,pin),j=await api({a:"login",tel:tel,h:h});
 if(!j.ok)throw new Error(t(j.error==="trop"?"eMany":"eLogin"));
 localStorage.setItem("kv-s",JSON.stringify({tel:tel,h:h}));setU(j,tel)}
function fail(x){$("err").textContent=x.message}

 if(tel.replace(/\D/g,"").length<8||pin.length<4){err("eInv");return}
 try{await login(tel,pin)}catch(x){fail(x)}};

var pend=null;

 var v=function(i){return $(i).value.trim().slice(0,120)};
 var d={a:"register",nom:v("sn"),prenom:v("sp"),tel:v("st"),email:v("se"),ref:v("sr"),methode:$("sm").value,tx:v("sx")},pin=$("sk").value;

 if(d.tel.replace(/\D/g,"").length<8){err("eTel");return}
 if(!/^\d{4,8}$/.test(pin)){err("ePin");return}
 try{d.h=await hsh(d.tel,pin);var j=await api(d);
  if(!j.ok){err(j.error==="dup"?"eDup":"eReg");return}
  pend={tel:d.tel,pin:pin};

  $("fs").classList.add("hid");$("fo").classList.remove("hid")}catch(x){fail(x)}};
