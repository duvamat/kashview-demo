<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KashView</title>
<style>
:root{--b:#1d4ed8;--bd:#1e3a8a;--bl:#e3ebfb;--o:#f59e0b;--o2:#ea580c;--bg:#eef3fc;--cd:#fff;--tx:#12203d;--mu:#5a6a8a;--br:#d6e0f3;--rd:#dc2626}
*{box-sizing:border-box}
body{margin:0;background:#d9e2f4;color:var(--tx);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--o);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:110px}
.top{background:linear-gradient(160deg,#2563eb,var(--bd));color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 70px;border-radius:0 0 34px 34px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:8px;font:800 1.3rem Georgia,serif}
.right{display:flex;align-items:center;gap:8px}
.chip{border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff;border-radius:22px;padding:8px 12px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:.9rem}
.lsel{background:rgba(255,255,255,.16);color:#fff;border:2px solid rgba(255,255,255,.4);border-radius:22px;padding:8px 8px;font-weight:700}
.lsel option{color:#12203d}
.top h1{font-size:1.7rem;margin:18px 0 2px}.top p{margin:0;opacity:.92}
.tot{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tot div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:12px}
.tot small{display:block;letter-spacing:.08em;font-weight:700;font-size:.72rem}.tot b{font-size:1.4rem}
.sec{display:none;padding:0 16px}.sec.on{display:block}
.bal{background:#fff;border-radius:28px;padding:20px;margin-top:-52px;box-shadow:0 10px 26px rgba(30,58,138,.25)}
.bal small{letter-spacing:.14em;font-weight:700;color:var(--b)}
.bal .n{font-size:2.8rem;font-weight:800;line-height:1.1;margin:6px 0 10px;color:var(--bd)}.bal .n span+span{font-size:1.2rem}
.pill{display:inline-block;border:1px solid var(--o);background:#fff4dd;color:#9a5a00;border-radius:20px;padding:6px 14px;font-weight:700;font-size:.9rem}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.mini div{background:var(--bl);border-radius:18px;padding:12px;text-align:center}
.mini small{display:block;letter-spacing:.08em;font-weight:700;font-size:.72rem;color:var(--mu)}.mini b{font-size:1.6rem;color:var(--b)}
.cta{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:14px;border:0;border-radius:22px;padding:18px;text-align:left;background:linear-gradient(135deg,var(--o),var(--o2));color:#fff;cursor:pointer}
.cta b{font-size:1.25rem;display:block}.cta span{opacity:.95;font-size:.92rem}.cta i{font-style:normal;font-size:1.6rem;background:rgba(255,255,255,.28);border-radius:50%;width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.two button{border:0;border-radius:20px;padding:16px 8px;font-weight:800;font-size:1rem;cursor:pointer;color:#fff}
.w{background:var(--b)}.p{background:var(--bd)}
.card{background:var(--cd);border:1px solid var(--br);border-radius:22px;padding:16px;margin-top:14px}
.card h2{margin:0 0 6px;font-size:1.1rem}
.ban{background:#fff4dd;border:1px solid var(--o);border-radius:16px;padding:12px;margin-top:14px;font-size:.92rem}
.ban button{margin-top:8px}
.btn{background:var(--b);color:#fff;border:0;border-radius:14px;padding:12px 16px;font-weight:800;cursor:pointer;display:inline-block;text-decoration:none;text-align:center}
.btn.or{background:var(--o2)}.btn.wa{background:#1fa855}.btn.o{background:#fff;color:var(--b);border:2px solid var(--b)}.btn.full{width:100%;display:block}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;background:#fff;border-radius:20px;padding:8px;margin-top:14px}
.chips button{border:0;background:none;border-radius:14px;padding:10px 14px;font-weight:700;color:var(--mu);white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--b);color:#fff}
.it{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;border-left:6px solid var(--o);padding:12px;margin-top:12px}
.it .ic{width:46px;height:46px;border-radius:12px;background:var(--bl);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex:none}
.it div.t{flex:1;min-width:0}.it small{color:var(--mu)}
.it .m{text-align:right;font-weight:800}.m.pos{color:var(--b)}.m.neg{color:var(--rd)}
.bd{display:inline-block;font-size:.72rem;font-weight:800;border-radius:12px;padding:3px 10px;margin-top:4px;background:#dbe7ff;color:var(--bd)}
.bd.y{background:#ffe9c2;color:#8a4f00}.bd.r{background:#fee2e2;color:#991b1b}
.code{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px dashed #f6c36b;border-radius:18px;padding:14px;background:#fffaf0;margin:10px 0}
.code b{font-size:1.5rem;letter-spacing:.12em;color:var(--o2)}
.hd{display:flex;align-items:center;justify-content:space-between;margin:18px 0 0}.hd h3{margin:0;font-size:1.2rem}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bd);border-radius:28px 28px 0 0;display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:10px 6px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
nav button{border:0;background:none;color:#c9d8fb;border-radius:16px;padding:8px 0;font-weight:700;font-size:.58rem;letter-spacing:-.01em;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;overflow:hidden}
nav button span{font-size:1.3rem}nav button.on{background:#fff;color:var(--b)}
.au{position:fixed;inset:0;background:linear-gradient(160deg,#2563eb,var(--bd));z-index:20;overflow:auto;display:none;padding:20px 16px}
.au.on{display:block}.au .box{max-width:420px;margin:0 auto;background:#fff;border-radius:26px;padding:18px}
.au label,.sh label{display:block;font-weight:700;font-size:.88rem;margin-top:10px}.au label small{font-weight:400;color:var(--mu)}
.au input,.au select.f,.sh input,.sh select{width:100%;padding:12px;margin-top:4px;border:1px solid var(--br);border-radius:12px;background:#fff}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;padding:10px;border:1px solid var(--br);border-radius:12px;background:var(--bg);font-weight:700;cursor:pointer}
.tabs button.on{background:var(--b);color:#fff;border-color:var(--b)}
#err{color:var(--rd);font-weight:700;min-height:1.3em;margin:10px 0 0;font-size:.9rem}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:15;display:none;align-items:flex-end;justify-content:center}
.sh.on{display:flex}.sh .in{background:var(--bg);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sh .in .btn{margin-top:10px}
.tk{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:12px;margin-top:10px}.tk div{flex:1}.tk small{color:var(--mu)}
.q{background:#fff;border-radius:20px;padding:16px;margin-top:14px}.q h3{margin:0 0 10px}.q .op{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border:2px solid var(--br);border-radius:14px;background:#fff;font-weight:700;cursor:pointer}
.q .op.ok{border-color:#16a34a;background:#dcfce7}.q .op.ko{border-color:var(--rd);background:#fee2e2}
.hid{display:none!important}
.lk{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px;margin-top:12px;text-decoration:none;color:inherit;border:0;width:100%;text-align:left;cursor:pointer;font:inherit}
.lk .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;flex:none}
.lk b{display:block}.lk small{color:var(--mu)}
.note{font-size:.85rem;color:var(--mu);margin:10px 0 0}
@media(min-width:900px){
body{background:var(--bg)}
.app{max-width:1180px;padding-bottom:30px;display:grid;grid-template-columns:250px 1fr;align-items:start;background:transparent}
nav{position:sticky;top:0;left:auto;transform:none;grid-column:1;grid-row:1;width:auto;max-width:none;height:100vh;border-radius:0 28px 28px 0;grid-template-columns:1fr;align-content:start;gap:6px;padding:28px 12px}
nav button{flex-direction:row;justify-content:flex-start;gap:12px;font-size:1rem;padding:13px 16px}
.sec{grid-column:2;grid-row:1;padding:0 28px 30px;min-width:0}
.top{border-radius:0 0 34px 34px;padding-top:28px}
#s0 .bal,.chips,.sec .card,.q{max-width:760px}
.sh .in{max-width:560px}
}
</style>
</head>

document.querySelectorAll("nav button").forEach(function(b){b.onclick=function(){show(+b.dataset.t0)}});
$("mk").onclick=function(){show(1)};
$("gc").onclick=function(e){var b=e.target.closest("button");if(!b)return;this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});
 ["pv","pq","pm"].forEach(function(p){$(p).classList.toggle("hid",p!==b.dataset.p)})};

function labels(){document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.dataset.t)});
 $("cp").textContent=t("copy");document.documentElement.lang=L;
 document.querySelectorAll(".lsel").forEach(function(s){s.value=L})}
function render(){
 $("au").classList.toggle("on",!U);if(!U)return;
 $("hi").textContent=t("hello",{n:U.prenom});
 $("a").textContent=n(U.solde);$("g").textContent=n(U.gains);$("nr").textContent=$("nr2").textContent=U.refs.length;
 $("na").textContent=U.refs.filter(function(r){return r.statut!=="En attente de paiement"}).length;
 var s=U.statut,pend=s==="En attente de paiement";
 $("st").textContent=pend?t("stPend"):s==="Vérifié"?t("stVer"):s==="Suspendu"?t("stSus"):t("stAct");
 $("kn").textContent=U.prenom+" "+U.nom;$("kt").textContent="📞 +"+U.tel.replace(/\D/g,"");
 $("kb").textContent=t(pend?"bdPend":s==="Vérifié"?"bdVer":s==="Suspendu"?"bdSus":"bdAct");$("kb").className="bd"+(pend?" y":"");
 $("cd").textContent=U.code||"—";
 $("sml").textContent=CFG.email;$("sem").href="mailto:"+CFG.email;
 var b=$("bn");b.innerHTML="";
 if(pend){b.innerHTML='<div class="ban">'+t("banPay")+'<br><button class="btn or" id="pv2">'+t("payNow")+'</button></div>';$("pv2").onclick=function(){openPay()}}
 else if(s==="Activé"){b.innerHTML='<div class="ban">'+t("banVer")+'<br><button class="btn or" id="vf">'+t("askVer")+'</button></div>';$("vf").onclick=function(){act("verify")}}
 if(!CFG.script)b.insertAdjacentHTML("beforeend",'<div class="ban">'+t("demo")+'</div>');
 hist();refs();tasks();videos();quiz(true);
}
function hist(){var tin=0,tout=0,l=$("hl");l.innerHTML="";
 U.hist.forEach(function(h){if(stat(h.s)==="ok"){if(h.m>0)tin+=h.m;else tout+=-h.m}});
 $("ti").textContent="+"+n(tin)+" HTG";$("to").textContent="-"+n(tout)+" HTG";
 var A=U.hist.filter(function(h){return!filt||kind(h.t)===filt});
 if(!A.length){l.innerHTML='<div class="card" style="color:var(--mu)">'+t("noHist")+'</div>';return}
 A.forEach(function(h){var k=kind(h.t),st=stat(h.s),d=document.createElement("div");d.className="it";
  d.innerHTML='<span class="ic">'+(ICO[k]||"💱")+'</span><div class="t"><b></b><small>📅 '+fd(h.d)+'</small></div><div class="m '+(h.m>=0?"pos":"neg")+'"><span></span><br><span class="bd'+(st==="ok"?"":st==="rej"?" r":" y")+'"></span></div>';
  d.querySelector("b").textContent=KL[k]?t(KL[k]):h.t;d.querySelector(".m span").textContent=(h.m>0?"+":"")+n(h.m)+" HTG";d.querySelector(".bd").textContent=String(h.s).toUpperCase();l.appendChild(d)})}
function refs(){var l=$("rl");l.innerHTML="";
 if(!U.refs.length){l.innerHTML='<div class="card" style="color:var(--mu)">'+t("noRef")+'</div>';return}
 U.refs.forEach(function(r){var d=document.createElement("div");d.className="it";var a=r.statut!=="En attente de paiement";
  d.innerHTML='<span class="ic">👤</span><div class="t"><b></b><small>📅 '+fd(r.date)+'</small></div><span class="bd'+(a?"":" y")+'">'+t(a?"active":"inactive")+'</span>';
  d.querySelector("b").textContent=r.nom;l.appendChild(d)})}
$("fc").onclick=function(e){var b=e.target.closest("button");if(!b)return;filt=b.dataset.f;this.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===b)});if(U)hist()};

function needActive(){if(U.statut==="En attente de paiement"){alert(t("aAct"));return true}return false}
function tasks(){var l=$("tl");l.innerHTML="";TK.forEach(function(k,j){
 var d=document.createElement("div");d.className="tk";d.innerHTML='<span style="font-size:1.6rem">'+k.i+'</span><div><b>'+t("task"+(j+1))+'</b><br><small>'+t("dur")+' : '+t("d"+(j+1))+' • '+t("rew")+' : '+k.r+' HTG</small></div>';
 var b=document.createElement("button");b.className="btn";b.textContent=t("tkGo");
 b.onclick=function(){if(needActive())return;wa("Bonjour KashView, je veux faire la mission : "+T.fr["task"+(j+1)]+" ("+k.r+" HTG)."+who())};
 d.appendChild(b);l.appendChild(d)})}
function videos(){var l=$("vl");l.innerHTML="";VIDEOS.forEach(function(v){
 var d=document.createElement("div");d.className="tk";d.innerHTML='<span style="font-size:1.6rem">🎬</span><div><b>'+t(v.k)+'</b><br><small>'+t("dur")+' : '+v.d+' min • '+t("rew")+' : '+v.r+' HTG</small></div>';
 var b=document.createElement("button");b.className="btn";
 if(!v.url){b.textContent=t("soon");b.disabled=true}
 else{b.textContent=t("watch");b.onclick=function(){if(needActive())return;if(!v.seen){window.open(v.url,"_blank");v.seen=true;b.textContent=t("claim")}
  else wa("Bonjour KashView, j'ai regardé la vidéo : "+T.fr[v.k]+" ("+v.r+" HTG). Je demande la validation."+who())}}
 d.appendChild(b);l.appendChild(d)})}
var qi=0,qs=0;
function quiz(reset){if(reset){qi=0;qs=0}var Q=(T[L].qz||T.fr.qz),b=$("qb");b.innerHTML="";
 if(qi===0&&reset){b.innerHTML='<p class="note">'+t("qzInfo",{n:Q.length,r:QR})+'</p><button class="btn full" id="qgo" style="margin-top:12px">'+t("qzStart")+'</button>';$("qgo").onclick=function(){qi=1;quiz()};return}
 if(qi>Q.length){var win=qs===Q.length;
  b.innerHTML='<div class="q"><h3>'+(win?t("qzWin"):"")+' '+t("qzScore",{s:qs,n:Q.length})+'</h3></div>';
  var x=document.createElement("button");x.className="btn full";x.style.marginTop="12px";
  if(win){x.textContent=t("qzClaim",{r:QR});x.onclick=function(){if(needActive())return;wa("Bonjour KashView, j'ai réussi le quiz ("+Q.length+"/"+Q.length+"). Je demande la validation de "+QR+" HTG."+who())}}
  else{x.textContent=t("qzRetry");x.onclick=function(){quiz(true)}}
  b.appendChild(x);return}
 var q=Q[qi-1],c=document.createElement("div");c.className="q";c.innerHTML='<small>'+t("qzQ",{i:qi,n:Q.length})+'</small><h3></h3>';c.querySelector("h3").textContent=q.q;
 q.o.forEach(function(o,j){var p=document.createElement("button");p.className="op";p.textContent=o;
  p.onclick=function(){c.querySelectorAll(".op").forEach(function(z,k){z.disabled=true;if(k===q.a)z.classList.add("ok");else if(k===j)z.classList.add("ko")});
   if(j===q.a)qs++;setTimeout(function(){qi++;quiz()},900)};c.appendChild(p)});b.appendChild(c)}

function mask(){return "••••••"+CFG.pay.slice(-4)}
function sheet(h){$("psb").innerHTML=h;$("ps").classList.add("on")}
function copyNum(btn){var ok=function(){btn.textContent=t("copied")};if(navigator.clipboard)navigator.clipboard.writeText(CFG.pay).then(ok,function(){prompt("",CFG.pay)});else prompt("",CFG.pay)}
function openers(){return '<a class="btn full" href="tel:'+CFG.ussd.replace("#","%23")+'">📞 '+t("oMon")+'</a><a class="btn full" href="tel:'+CFG.ussd.replace("#","%23")+'">📞 '+t("oNat")+'</a>'+
 '<div class="row"><a class="btn o" target="_blank" rel="noopener" href="'+CFG.stores.moncash+'">'+t("aMon")+'</a><a class="btn o" target="_blank" rel="noopener" href="'+CFG.stores.natcash+'">'+t("aNat")+'</a></div><p class="note">'+t("ussd")+'</p>'}
function openPay(){sheet('<h3 style="margin:0 0 6px">'+t("payT")+'</h3><p class="note" style="margin-top:0">'+t("payS")+'</p>'+
 '<div class="code"><div><small>'+t("payTo")+'</small><br><b style="font-size:1.2rem">'+mask()+'</b></div><button class="btn or" id="cn">'+t("copyNum")+'</button></div>'+openers()+
 '<button class="btn wa full" id="pd">'+t("paid")+'</button>');
 $("cn").onclick=function(){copyNum(this)};$("pd").onclick=function(){wa("Bonjour KashView, voici ma preuve de paiement de 250 HTG."+who())}}
function openWd(){sheet('<h3 style="margin:0 0 6px">'+t("wdT")+'</h3>'+
 '<label for="wm">'+t("wdM")+'</label><select id="wm"><option>MonCash</option><option>NatCash</option></select>'+
 '<label for="ww">'+t("wdW")+'</label><input id="ww" type="tel" inputmode="tel">'+
 '<label for="wq">'+t("wdA")+'</label><input id="wq" type="number" inputmode="numeric" min="200">'+
 '<p id="we" style="color:var(--rd);font-weight:700;margin:8px 0 0"></p><button class="btn wa full" id="wg">'+t("wdSend")+'</button>'+
 '<p class="note"><b>'+t("wdCheck")+'</b></p>'+openers());
 $("wg").onclick=function(){var q=parseInt($("wq").value,10),w=$("ww").value.replace(/[^\d+]/g,"");
  if(w.replace(/\D/g,"").length<8||!q){$("we").textContent=t("eTel");return}
  if(q<200){$("we").textContent=t("aMin");return}
  if(q>U.solde){$("we").textContent=t("aInsuf");return}
  wa("Bonjour KashView, je demande un retrait de "+q+" HTG par "+$("wm").value+" au "+w+"."+who())}}
$("psx").onclick=function(){$("ps").classList.remove("on")};

async function act(a){
 if(a==="help"){wa("Bonjour KashView, j'ai besoin d'aide."+who());return}
 if(a==="logout"){localStorage.removeItem("kv-s");U=null;$("fo").classList.add("hid");sw(0);render();return}
 if(!U)return;
 if(a==="pay"){openPay();return}
 if(a==="verify"){if(needActive())return;wa("Bonjour KashView, je demande la vérification de mon compte. J'envoie ma pièce d'identité."+who());return}
 if(a==="pin"){var o=prompt(t("pOld")),p=prompt(t("pNew"));if(!o||!/^\d{4,8}$/.test(p||""))return;
  try{var j=await api({a:"pin",tel:U.tel,h:await hsh(U.tel,o),h2:await hsh(U.tel,p)});
   if(j.ok){localStorage.setItem("kv-s",JSON.stringify({tel:U.tel,h:await hsh(U.tel,p)}));alert(t("aPinOk"))}else alert(t("aPinBad"))}catch(x){alert(x.message)}return}
 if(a==="transfer"){
  if(U.statut!=="Vérifié"){alert(t("aTrOnly"));return}
  var to=prompt(t("pTo"));if(!to)return;
  var m=parseInt(prompt(t("pAmt")),10);if(!m||m<=0)return;
  if(m>U.solde){alert(t("aInsuf"));return}
  var f=Math.floor(m/100);
  if(confirm(t("cTr",{m:n(m),f:f,r:n(m-f)})))wa("Bonjour KashView, je demande un transfert de "+m+" HTG vers "+to+" (frais 1 % : "+f+" HTG)."+who());return}
 if(a==="withdraw"){
  if(needActive())return;
  if(U.taches<20||U.gains<250){alert(t("aWd",{t:U.taches,g:n(U.gains)}));return}
  openWd()}
}
document.querySelectorAll("[data-act]").forEach(function(e){e.onclick=function(){act(e.dataset.act)}});
$("cp").onclick=function(){var c=U.code,ok=function(){$("cp").textContent=t("copied")};
 if(navigator.clipboard)navigator.clipboard.writeText(c).then(ok,function(){prompt("",c)});else prompt("",c)};
function msg(){return "KashView : "+U.code+" "+location.href.split("#")[0]}
$("shw").onclick=function(){window.open("https://wa.me/?text="+encodeURIComponent(msg()),"_blank")};
$("sh").onclick=function(){if(navigator.share)navigator.share({text:msg()}).catch(function(){});else $("shw").click()};

document.querySelectorAll(".lsel").forEach(function(s){s.onchange=function(){L=s.value;try{localStorage.setItem("kv-lang",L)}catch(e){}labels();render();$("err").textContent=""}});
function sw(i){$("fs").classList.toggle("hid",!!i);$("fl").classList.toggle("hid",!i);$("t2").classList.toggle("on",!i);$("t1").classList.toggle("on",!!i);$("err").textContent=""}
$("t1").onclick=function(){sw(1)};$("t2").onclick=function(){sw(0)};
function err(k){$("err").textContent=k?t(k):""}
function setU(j,tel){U={nom:j.nom,prenom:j.prenom,tel:tel,statut:j.statut,code:j.code||"",solde:+j.solde||0,reserve:+j.reserve||0,gains:+j.gains||0,taches:+j.taches||0,refs:j.refs||[],hist:j.hist||[]};render()}
async function login(tel,pin){var h=await hsh(tel,pin),j=await api({a:"login",tel:tel,h:h});
 if(!j.ok)throw new Error(t(j.error==="trop"?"eMany":"eLogin"));
 localStorage.setItem("kv-s",JSON.stringify({tel:tel,h:h}));setU(j,tel)}
function fail(x){$("err").textContent=x.message}

$("fl").onsubmit=async function(e){e.preventDefault();err();var tel=$("lt").value.trim(),pin=$("lp").value;
 if(tel.replace(/\D/g,"").length<8||pin.length<4){err("eInv");return}
 try{await login(tel,pin)}catch(x){fail(x)}};

var pend=null;
$("fs").onsubmit=async function(e){e.preventDefault();err();
 var v=function(i){return $(i).value.trim().slice(0,120)};
 var d={a:"register",nom:v("sn"),prenom:v("sp"),tel:v("sph"),email:v("se"),ref:v("sr"),methode:"MonCash / NatCash",tx:""},pin=$("sk").value;
 if(!d.nom||!d.prenom||!d.tel||!d.email){err("eReq");return}
 if(!/^\S+@\S+\.\S+$/.test(d.email)){err("eMail");return}
 if(d.tel.replace(/\D/g,"").length<8){err("eTel");return}
 if(!/^\d{4,8}$/.test(pin)){err("ePin");return}
 try{d.h=await hsh(d.tel,pin);var j=await api(d);
  if(!j.ok){err(j.error==="dup"?"eDup":"eReg");return}
  pend={tel:d.tel,pin:pin};
  $("fw").href="https://wa.me/"+CFG.wa+"?text="+encodeURIComponent("Bonjour KashView, je viens de créer mon compte.\n\nNom : "+d.nom+"\nPrénom : "+d.prenom+"\nTéléphone : "+d.tel+"\nE-mail : "+d.email+(d.ref?"\nCode référence : "+d.ref:""));
  $("fs").classList.add("hid");$("fo").classList.remove("hid")}catch(x){fail(x)}};
$("fp").onclick=function(){login(pend.tel,pend.pin).then(function(){$("fo").classList.add("hid");sw(0);openPay()}).catch(fail)};
$("fg").onclick=async function(){try{await login(pend.tel,pend.pin);$("fo").classList.add("hid");sw(0)}catch(x){fail(x)}};

try{var sl=localStorage.getItem("kv-lang");if(sl&&T[sl])L=sl}catch(e){}
labels();render();
try{var S=JSON.parse(localStorage.getItem("kv-s")||"null");
 if(S)api({a:"login",tel:S.tel,h:S.h}).then(function(j){if(j.ok)setU(j,S.tel)}).catch(function(){})}catch(e){}
</script>
</body>
</html>
